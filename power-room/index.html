<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>알공 동력실 연출</title><style>body{margin:0;background:#153b38;min-height:100vh;display:grid;place-content:center;gap:16px}canvas{width:min(96vw,1080px);height:auto;border-radius:16px}button{justify-self:center;font:600 18px sans-serif;padding:12px 32px;border:0;border-radius:28px;background:#fff5dc;color:#173c39}</style><canvas width="900" height="600" aria-label="알공 동력실 연출"></canvas><button type="button">정지</button><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),b=document.querySelector('button');let frames=[],i=0,running=true,timer;async function start(){if('ImageDecoder'in window){const data=await(await fetch('motion.gif')).arrayBuffer(),d=new ImageDecoder({data,type:'image/gif'});await d.tracks.ready;for(let k=0;k<d.tracks.selectedTrack.frameCount;k++){let r=await d.decode({frameIndex:k});frames.push({image:r.image,duration:Math.max(20,r.image.duration/1000)})}tick()}else{const img=new Image();img.onload=()=>{x.drawImage(img,0,0,900,600);timer=setInterval(()=>{if(running)x.drawImage(img,0,0,900,600)},40)};img.src='motion.gif'}}function tick(){if(!running)return;x.drawImage(frames[i].image,0,0,900,600);let delay=frames[i].duration;i=(i+1)%frames.length;timer=setTimeout(tick,delay)}b.onclick=()=>{running=!running;b.textContent=running?'정지':'재생';if(frames.length){clearTimeout(timer);if(running)tick()}};start();</script></html>
