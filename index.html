<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배지 연출</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fffaf3;color:#244f53;font:16px system-ui,sans-serif}main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:16px}img{display:block;width:min(100%,720px);height:auto;max-height:calc(100svh - 110px);object-fit:contain}nav{display:flex;gap:10px}button{padding:10px 22px;border:0;border-radius:10px;background:#26776d;color:#fff;font:inherit;cursor:pointer}button.secondary{background:#dce9e4;color:#244f53}button:focus-visible{outline:3px solid #dc9c25;outline-offset:3px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}</style></head>
<body><main><img id="motion" src="popup.png" alt="배지 연출 정지 이미지"><nav aria-label="연출 재생"><button id="play" type="button">▶ 재생</button><button id="stop" type="button" class="secondary">■ 정지</button></nav><span id="status" class="sr-only" role="status" aria-live="polite">정지</span></main>
<script>
const motion=document.getElementById('motion'),status=document.getElementById('status');
document.getElementById('play').onclick=()=>{motion.src='popup-fit.gif?play='+Date.now();motion.alt='배지 연출 애니메이션';status.textContent='재생 중'};
document.getElementById('stop').onclick=()=>{motion.src='popup.png';motion.alt='배지 연출 정지 이미지';status.textContent='정지'};
</script></body></html>
