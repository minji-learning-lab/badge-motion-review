<!doctype html><html lang="ko"><meta charset="utf-8"><title>1학년 1학기 · 전체 원본/코드 비교</title>
<style>*{box-sizing:border-box}body{font:14px system-ui,sans-serif;margin:0;background:#dedfe3;color:#20232a}header{position:fixed;inset:0 0 auto;background:#fff;padding:14px 20px;z-index:2}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}select,input{font:inherit;padding:6px}header p{margin:8px 0 0;color:#645348;font-size:12px}#viewport{margin-top:108px;height:calc(100vh - 108px);overflow:auto}#board{padding:24px;width:4310px;transform-origin:0 0}article{margin-bottom:36px}h3{margin:0 0 10px;font-size:28px}.row{display:flex;gap:20px}figure{margin:0;width:1024px;flex:none}figcaption{padding:12px;background:white;font-size:22px}img{display:block;width:1024px;height:576px;background:repeating-conic-gradient(#eee 0% 25%,white 0% 50%) 0 / 20px 20px}.flag{color:#9b3c12}a{color:#255fa5}#search{width:230px}</style>
<header><div class="controls"><b>1학년 1학기 · 샘플 6문항</b><select id="unit"><option value="">전체 단원</option></select><select id="status"><option value="">전체 상태</option><option value="manual">기존 직접 작성 51문항</option><option value="ocr">추가 구조화 345문항</option><option value="issues">글자 배치 검수 필요</option></select><input id="search" placeholder="문항 ID / 제목 검색"><input id="zoom" type="range" min="15" max="100" value="25"><span id="percent">25%</span></div><p>1·2학년 제작·검수 효율화 연구의 1차 샘플입니다. 현재 화면은 1학년 수 세기 6문항이며, 전체 학년 검수 완료를 의미하지 않습니다. <span id="summary"></span></p></header>
<div id="viewport"><div id="space"><main id="board"></main></div></div><script type="module">
const version='20261031-text-review',data=(await(await fetch('semester-code.json')).json()).items,semester=await(await fetch('semester-work.json')).json(),originals=new Map(semester.units.flatMap(u=>u.items).map(i=>[i.id,i]));
const unit=document.querySelector('#unit'),status=document.querySelector('#status'),search=document.querySelector('#search');semester.units.forEach(u=>unit.add(new Option(u.title+' · '+u.total+'문항',u.unit)));
const domainRegistry=(await(await fetch('curriculum-domain-registry.json')).json()).domains,domain=document.createElement('select');domain.id='domain';domain.add(new Option('전체 교육과정 영역',''));for(const [code,entry] of Object.entries(domainRegistry))domain.add(new Option(entry.name+' · '+data.filter(i=>i.curriculumDomain===code).length+'문항',code));status.after(domain);search.placeholder='문항 ID / 제목 / 성취기준';
status.add(new Option('교육과정 난이도 확인 · 2문항','curriculum'));
status.add(new Option('개별 요소 분리 · '+data.filter(i=>i.componentization?.sourceCompositeLayerRemoved).length+'문항','components'));
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const pending=i=>(i.review?.unresolvedText||[]).filter(v=>!v.resolvedBy).length;
function scale(){const h=document.querySelector('header').getBoundingClientRect().height+8,viewport=document.querySelector('#viewport');viewport.style.marginTop=h+'px';viewport.style.height=`calc(100vh - ${h}px)`;const v=+document.querySelector('#zoom').value;document.querySelector('#board').style.transform=`scale(${v/100})`;document.querySelector('#space').style.width=4310*v/100+'px';document.querySelector('#space').style.height=document.querySelector('#board').scrollHeight*v/100+'px';document.querySelector('#percent').textContent=v+'%'}
function paint(){
 const shown=data.map((i,index)=>({i,index})).filter(({i})=>{const o=originals.get(i.id),ocr=i.review?.status==='OCR_IMPORT_REQUIRES_CONTENT_REVIEW';return(!unit.value||unit.value===`1-1-${o.source.unit}`)&&(!domain.value||i.curriculumDomain===domain.value)&&(!status.value||status.value==='ocr'&&ocr||status.value==='manual'&&!ocr||status.value==='components'&&i.componentization?.sourceCompositeLayerRemoved||status.value==='issues'&&pending(i)>0||status.value==='curriculum'&&i.curriculum?.reviewFlags?.length>0)&&(!search.value||(i.id+' '+i.title+' '+(i.curriculum?.achievementCodes||[]).join(' ')).toLowerCase().includes(search.value.toLowerCase()))});
 document.querySelector('#summary').textContent=`표시 ${shown.length}문항 · 교육과정은 1차 연결, 최종 검수 전`;
 document.querySelector('#board').innerHTML=shown.map(({i,index})=>{const o=originals.get(i.id),ocr=i.review?.status==='OCR_IMPORT_REQUIRES_CONTENT_REVIEW';return `<article><h3>${esc(i.id)} · ${esc(i.title)} · <span class="flag">${ocr?'추가 구조화 초안':'기존 직접 작성'}${pending(i)?' · 인식 확인 '+pending(i)+'곳':''}</span> · ${esc(domainRegistry[i.curriculumDomain]?.name||'영역 미연결')} · ${esc((i.curriculum?.achievementCodes||[]).join(', '))} · <a target="_blank" href="code-viewer.html?pool=semester&item=${index}">코드·PNG 내보내기</a></h3><div class="row">${[['원본 문제 Q',o.original.question],['코드 렌더 문제 Q','semester-png/Q_'+i.id+'.png'],['원본 해설 A',o.original.solution],['코드 렌더 해설 A','semester-png/A_'+i.id+'.png']].map(([label,url])=>`<figure><figcaption>${label}</figcaption><img loading="lazy" decoding="async" alt="${esc(i.id+' '+label)}" src="${url}?v=${version}"></figure>`).join('')}</div></article>`}).join('');document.querySelector('#viewport').scrollTop=0;scale()
 document.querySelectorAll('#board article').forEach((article,index)=>{if(shown[index].i.curriculum?.reviewFlags?.length){const badge=document.createElement('span');badge.className='flag';badge.textContent=' · 교육과정 난이도 확인';article.querySelector('h3').append(badge)}});scale();
 document.querySelectorAll('#board article').forEach((article,index)=>{if(shown[index].i.componentization?.sourceCompositeLayerRemoved){const badge=document.createElement('span');badge.style.color='#166534';badge.textContent=' · 개별 요소 코드 + 분리 삽화';article.querySelector('h3').append(badge)}});scale();
}
unit.onchange=paint;status.onchange=paint;domain.onchange=paint;search.oninput=paint;document.querySelector('#zoom').oninput=scale;window.onresize=scale;if(new URLSearchParams(location.search).has('mode'))status.value=new URLSearchParams(location.search).get('mode');paint();
</script></html>
